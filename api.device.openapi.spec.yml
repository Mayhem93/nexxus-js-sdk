openapi: 3.1.0
info:
  title: Nexxus API - Device Management
  version: 1.0.0
  description: |
    API endpoints for managing devices in the Nexxus real-time synchronization platform.

    Devices represent client connections (web browsers, mobile apps, IoT devices) that can
    subscribe to channels and receive real-time updates.
  contact:
    name: Nexxus API Support
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Device
    description: Device registration and management endpoints

security:
  - BearerAuth: []

paths:
  /device/register:
    post:
      tags:
        - Device
      summary: Register a new device
      description: |
        Registers a new device for the authenticated user. Returns device credentials
        that should be used for subsequent requests.

        The device will be assigned a unique ID and can then create subscriptions
        to receive real-time updates.
      operationId: registerDevice
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - transport
              properties:
                name:
                  type: string
                  description: Human-readable name for the device
                  example: "John's iPhone"
                transport:
                  type: string
                  enum:
                    - websockets-transport
                  description: Transport type for real-time communication
                  example: "websockets-transport"
            examples:
              mobileDevice:
                summary: Mobile device registration
                value:
                  name: "John's iPhone"
                  transport: "websockets-transport"
              webBrowser:
                summary: Web browser registration
                value:
                  name: "Chrome on MacBook"
                  transport: "websockets-transport"
      responses:
        '201':
          description: Device registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                success:
                  summary: Successful device registration
                  value:
                    id: "dev_abc123xyz"
                    userId: "user_789"
                    name: "John's iPhone"
                    transport: "websockets-transport"
                    status: "offline"
                    appId: "myapp"
                    createdAt: "2026-01-30T10:30:00.000Z"
                    updatedAt: "2026-01-30T10:30:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'

  /device/:
    get:
      tags:
        - Device
      summary: Get device information
      description: |
        Retrieves information about a specific device.
        Requires the `nxx-device-id` header to identify the device.
      operationId: getDevice
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                online:
                  summary: Online device
                  value:
                    id: "dev_abc123xyz"
                    userId: "user_789"
                    name: "John's iPhone"
                    transport: "websockets-transport"
                    status: "online"
                    appId: "myapp"
                    createdAt: "2026-01-30T10:30:00.000Z"
                    updatedAt: "2026-01-30T10:35:00.000Z"
                offline:
                  summary: Offline device
                  value:
                    id: "dev_abc123xyz"
                    userId: "user_789"
                    name: "John's iPhone"
                    transport: "websockets-transport"
                    status: "offline"
                    appId: "myapp"
                    createdAt: "2026-01-30T10:30:00.000Z"
                    updatedAt: "2026-01-30T10:35:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'

    put:
      tags:
        - Device
      summary: Update device information
      description: |
        Updates device properties (currently only the name can be updated).
        Requires the `nxx-device-id` header to identify the device.
      operationId: updateDevice
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: New name for the device
                  example: "John's iPad Pro"
            examples:
              renameDevice:
                summary: Rename device
                value:
                  name: "John's iPad Pro"
      responses:
        '200':
          description: Device updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                success:
                  summary: Successfully updated device
                  value:
                    id: "dev_abc123xyz"
                    userId: "user_789"
                    name: "John's iPad Pro"
                    transport: "websockets-transport"
                    status: "online"
                    appId: "myapp"
                    createdAt: "2026-01-30T10:30:00.000Z"
                    updatedAt: "2026-01-30T11:00:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'

  /device/list:
    get:
      tags:
        - Device
      summary: List all user devices
      description: |
        Retrieves a list of all devices registered for the authenticated user
        in the specified application.
      operationId: listDevices
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: List of devices retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
              examples:
                multipleDevices:
                  summary: User with multiple devices
                  value:
                    - id: "dev_abc123xyz"
                      userId: "user_789"
                      name: "John's iPhone"
                      transport: "websockets-transport"
                      status: "online"
                      appId: "myapp"
                      createdAt: "2026-01-30T10:30:00.000Z"
                      updatedAt: "2026-01-30T10:35:00.000Z"
                    - id: "dev_def456uvw"
                      userId: "user_789"
                      name: "John's MacBook"
                      transport: "websockets-transport"
                      status: "offline"
                      appId: "myapp"
                      createdAt: "2026-01-29T14:20:00.000Z"
                      updatedAt: "2026-01-29T18:45:00.000Z"
                emptyList:
                  summary: No devices registered
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from authentication endpoints.
        Required for all device operations when authentication is enabled.

  parameters:
    AppId:
      name: nxx-app-id
      in: header
      required: true
      schema:
        type: string
      description: Application ID identifying the tenant/application context
      example: "myapp"

    DeviceId:
      name: nxx-device-id
      in: header
      required: true
      schema:
        type: string
      description: Device ID for identifying a specific device
      example: "dev_abc123xyz"

  schemas:
    Device:
      type: object
      required:
        - id
        - userId
        - name
        - transport
        - status
        - appId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique device identifier
          example: "dev_abc123xyz"
        userId:
          type: string
          description: ID of the user who owns this device
          example: "user_789"
        name:
          type: string
          description: Human-readable device name
          example: "John's iPhone"
        transport:
          type: string
          enum:
            - websockets-transport
          description: Transport protocol used for real-time communication
          example: "websockets-transport"
        status:
          type: string
          enum:
            - online
            - offline
            - unknown
          description: Current connection status of the device
          example: "online"
        appId:
          type: string
          description: Application ID this device belongs to
          example: "myapp"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when device was registered
          example: "2026-01-30T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of last device update
          example: "2026-01-30T10:35:00.000Z"

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type/code
          example: "InvalidParametersException"
        message:
          type: string
          description: Human-readable error message
          example: "Missing required parameter: name"
        details:
          type: object
          description: Additional error context (optional)
          additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingParameter:
              summary: Missing required parameter
              value:
                error: "InvalidParametersException"
                message: "Missing required parameter: name"
            invalidTransport:
              summary: Invalid transport type
              value:
                error: "InvalidParametersException"
                message: "Invalid transport type. Must be one of: websockets-transport"

    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              summary: No authentication token provided
              value:
                error: "UnauthorizedException"
                message: "Authentication required"
            invalidToken:
              summary: Invalid or expired token
              value:
                error: "UnauthorizedException"
                message: "Invalid authentication token"

    DeviceNotFound:
      description: Device not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              summary: Device does not exist
              value:
                error: "NotFoundException"
                message: "Device not found"

    ApplicationNotFound:
      description: Application not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              summary: Application does not exist
              value:
                error: "NotFoundException"
                message: "Application not found"
