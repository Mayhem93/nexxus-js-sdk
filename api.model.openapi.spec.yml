openapi: 3.1.0
info:
  title: Nexxus API - App Model Management
  version: 1.0.0
  description: |
    API endpoints for managing application-specific models in the Nexxus platform.

    Models are custom data types defined by the application (e.g., "task", "project", "order").
    All mutation operations (create, update, delete) are asynchronous and queued for processing.
  contact:
    name: Nexxus API Support
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Model
    description: App model CRUD operations

security:
  - BearerAuth: []

paths:
  /model/:
    post:
      tags:
        - Model
      summary: Create a new app model instance
      description: |
        Creates a new instance of an application-specific model type.

        This operation is asynchronous - the request is queued to the Writer Worker
        which persists the data and notifies subscribed clients.

        The `userId` field is automatically added from the authenticated user.
      operationId: createModel
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  description: Model type defined in the application schema
                  example: "task"
              additionalProperties: true
              description: |
                Model data with custom fields based on the application schema.
                Common fields like `id`, `createdAt`, `updatedAt`, `userId`, and `appId`
                are automatically added by the system.
            examples:
              task:
                summary: Create a task
                value:
                  type: "task"
                  title: "Complete documentation"
                  description: "Write OpenAPI specs for all routes"
                  status: "todo"
                  priority: "high"
                  dueDate: "2026-02-15T00:00:00.000Z"
              project:
                summary: Create a project
                value:
                  type: "project"
                  name: "Q1 Launch"
                  description: "Product launch for Q1 2026"
                  status: "active"
                  budget: 50000
      responses:
        '202':
          description: Model creation queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
              examples:
                success:
                  summary: Successfully queued
                  value:
                    message: "Model creation queued successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'

  /model/{id}:
    get:
      tags:
        - Model
      summary: Get a model instance by ID
      description: |
        Retrieves a specific model instance by its ID.

        This operation is synchronous and reads directly from the database.
        Requires the `type` query parameter to specify the model type.
      operationId: getModel
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the model instance
          example: "task_abc123"
        - name: type
          in: query
          required: true
          schema:
            type: string
          description: Model type (e.g., "task", "project")
          example: "task"
      responses:
        '200':
          description: Model instance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AppModel'
              examples:
                task:
                  summary: Task model instance
                  value:
                    data:
                      id: "task_abc123"
                      type: "task"
                      appId: "myapp"
                      userId: "user_789"
                      title: "Complete documentation"
                      description: "Write OpenAPI specs for all routes"
                      status: "in_progress"
                      priority: "high"
                      dueDate: "2026-02-15T00:00:00.000Z"
                      createdAt: "2026-01-30T10:00:00.000Z"
                      updatedAt: "2026-01-30T14:30:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'

    put:
      tags:
        - Model
      summary: Update a model instance
      description: |
        Updates a model instance using custom JsonPatch operations.

        This operation is asynchronous - the request is queued to the Writer Worker
        which applies the patches and notifies subscribed clients.

        Supports multiple operations: `replace`, `append`, `prepend`, `incr`, `decr`.
      operationId: updateModel
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the model instance
          example: "task_abc123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelBody'
            examples:
              replaceFields:
                summary: Replace multiple fields
                value:
                  type: "task"
                  patch:
                    op: "replace"
                    path: ["status", "priority"]
                    value: ["completed", "low"]
              incrementCounter:
                summary: Increment a numeric field
                value:
                  type: "task"
                  patch:
                    op: "incr"
                    path: ["viewCount"]
                    value: [1]
              appendToArray:
                summary: Append to an array field
                value:
                  type: "task"
                  patch:
                    op: "append"
                    path: ["tags"]
                    value: [["urgent", "backend"]]
      responses:
        '202':
          description: Model update queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
              examples:
                success:
                  summary: Successfully queued
                  value:
                    message: "Model update queued successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'

    delete:
      tags:
        - Model
      summary: Delete a model instance
      description: |
        Deletes a model instance by its ID.

        This operation is asynchronous - the request is queued to the Writer Worker
        which removes the data and notifies subscribed clients.
      operationId: deleteModel
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the model instance
          example: "task_abc123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  description: Model type (e.g., "task", "project")
                  example: "task"
            examples:
              deleteTask:
                summary: Delete a task
                value:
                  type: "task"
      responses:
        '202':
          description: Model deletion queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
              examples:
                success:
                  summary: Successfully queued
                  value:
                    message: "Model deletion queued successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from authentication endpoints.
        Required for all model operations when authentication is enabled.

  parameters:
    AppId:
      name: nxx-app-id
      in: header
      required: true
      schema:
        type: string
      description: Application ID identifying the tenant/application context
      example: "myapp"

  schemas:
    AppModel:
      type: object
      required:
        - id
        - type
        - appId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique model instance identifier
          example: "task_abc123"
        type:
          type: string
          description: Model type as defined in application schema
          example: "task"
        appId:
          type: string
          description: Application ID this model belongs to
          example: "myapp"
        userId:
          type: string
          description: ID of the user who owns this model (optional for some model types)
          example: "user_789"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when model was created
          example: "2026-01-30T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of last model update
          example: "2026-01-30T14:30:00.000Z"
      additionalProperties: true
      description: |
        Application-specific model with custom fields based on the schema.
        Only common fields are documented here; actual models contain additional
        fields defined by the application developer.

    UpdateModelBody:
      type: object
      required:
        - type
        - patch
      properties:
        type:
          type: string
        patch:
          type: object
          required:
            - op
            - path
            - value
          properties:
            op:
              type: string
              enum:
                - replace
                - append
                - prepend
                - incr
                - decr
              description: |
                Patch operation type:
                - `replace`: Replace field values
                - `append`: Append to array fields
                - `prepend`: Prepend to array fields
                - `incr`: Increment numeric fields
                - `decr`: Decrement numeric fields
              example: "replace"
            path:
              type: array
              items:
                type: string
              description: |
                Array of field paths to modify (supports dot notation for nested fields).
                Multiple paths can be specified for batch operations.
              example: ["status", "priority"]
            value:
              type: array
              items: {}
              description: |
                Array of values corresponding to each path.
                Must have the same length as the `path` array.
              example: ["completed", "low"]

    AsyncOperationResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Confirmation message for the queued operation
          example: "Model creation queued successfully"

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type/code
          example: "InvalidParametersException"
        message:
          type: string
          description: Human-readable error message
          example: "Missing required parameter: type"
        details:
          type: object
          description: Additional error context (optional)
          additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingType:
              summary: Missing required type parameter
              value:
                error: "InvalidParametersException"
                message: "Missing required parameter: type"
            invalidPatch:
              summary: Invalid JsonPatch format
              value:
                error: "InvalidParametersException"
                message: "Invalid patch operation: path and value arrays must have the same length"
            typeNotInSchema:
              summary: Model type not defined in schema
              value:
                error: "InvalidParametersException"
                message: "Model type 'invalid_type' does not exist in application schema"

    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              summary: No authentication token provided
              value:
                error: "UnauthorizedException"
                message: "Authentication required"
            invalidToken:
              summary: Invalid or expired token
              value:
                error: "UnauthorizedException"
                message: "Invalid authentication token"

    ModelNotFound:
      description: Model instance not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              summary: Model does not exist
              value:
                error: "NotFoundException"
                message: "Model not found"

    ApplicationNotFound:
      description: Application not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              summary: Application does not exist
              value:
                error: "NotFoundException"
                message: "Application not found"
